<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Redes PAN - 10 Animações Interativas</title>
    <!-- Tailwind CSS para design moderno, flexível e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca Lucide para ícones vetoriais modernos -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Estilos e Animações CSS Personalizadas */
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.08); opacity: 0.4; }
        }
        @keyframes wave-pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        @keyframes float-vertical {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes heart-beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .pulse-circle {
            animation: pulse-slow 3s infinite ease-in-out;
        }
        .wave-effect {
            animation: wave-pulse 2s infinite linear;
        }
        .float-element {
            animation: float-vertical 4s infinite ease-in-out;
        }
        .heart-beat-element {
            animation: heart-beat 1.2s infinite ease-in-out;
        }
        /* Transições suaves para troca de ecrãs */
        .fade-in-active {
            animation: fadeIn 0.5s forwards ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-blue-500 selection:text-white">

    <!-- Cabeçalho Principal -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-5 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400 flex items-center justify-center md:justify-start gap-3">
                    <i data-lucide="network" class="text-blue-500"></i> O que é uma Rede PAN?
                </h1>
                <p class="text-slate-400 text-xs md:text-sm mt-1">Ferramenta Interativa com 10 Animações Didáticas para Apresentação de Trabalho</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-950/60 p-1.5 rounded-full border border-slate-800">
                <span class="text-xs font-semibold px-3 py-1 text-blue-400">Suporte Técnico</span>
            </div>
        </div>
    </header>

    <!-- Área de Exposição do Trabalho -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
        
        <!-- Menu Esquerdo: Navegação de Tópicos (4 Colunas no Desktop) -->
        <div class="lg:col-span-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3 max-h-[80vh] lg:max-h-[600px] overflow-y-auto custom-scrollbar">
            <div class="pb-2 border-b border-slate-800 flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="list-video" class="text-blue-400 w-4 h-4"></i> Roteiro de Cenas
                </h2>
                <span class="text-xs bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full font-bold">10 Cenas</span>
            </div>
            <div id="animation-menu" class="flex flex-col gap-2">
                <!-- Injetado via Javascript dinamicamente -->
            </div>
        </div>

        <!-- Palco Central: Visualizador das Animações (8 Colunas no Desktop) -->
        <div class="lg:col-span-8 bg-slate-900/30 rounded-2xl border border-slate-800/80 p-6 flex flex-col justify-between min-h-[500px] lg:min-h-[600px] relative overflow-hidden shadow-2xl">
            
            <!-- Barra Superior do Painel de Visualização -->
            <div class="z-10 flex justify-between items-start border-b border-slate-800/60 pb-4">
                <div>
                    <span id="topic-number" class="text-xs font-bold text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full tracking-widest uppercase">Cena 1</span>
                    <h3 id="topic-title" class="text-lg md:text-2xl font-bold text-white mt-2">Carregando Tópico...</h3>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="btn-replay" class="p-2 bg-slate-800/80 hover:bg-slate-700/80 text-blue-400 hover:text-blue-300 rounded-xl transition border border-slate-700/50" title="Reiniciar esta animação">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Palco Principal onde ocorrem as animações gráficas -->
            <div id="animation-stage" class="flex-grow flex items-center justify-center relative my-6 min-h-[280px] bg-slate-950/40 rounded-xl border border-slate-850/50">
                <!-- Renderizado via Javascript -->
            </div>

            <!-- Caixa de Texto Explicativa para Orientação de Apresentação -->
            <div class="z-10 bg-slate-950/80 border border-slate-800/80 p-4 rounded-xl">
                <h4 class="text-xs font-bold text-blue-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                    <i data-lucide="info" class="w-4 h-4"></i> Explicação:
                </h4>
                <p id="topic-description" class="text-xs md:text-sm text-slate-300 leading-relaxed">
                    Carregando a orientação explicativa...
                </p>
            </div>

        </div>

    </main>

    <!-- Rodapé e Controlos de Passagem de Diapositivos -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <span class="text-xs text-slate-500 font-medium">Usa os botões para apresentar sequencialmente na sala de aula.</span>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-prev" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 disabled:hover:bg-slate-800 text-slate-300 rounded-xl border border-slate-700 flex items-center gap-2 text-sm font-semibold transition">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Anterior
                </button>
                <button id="btn-next" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center gap-2 text-sm font-semibold transition shadow-lg shadow-blue-600/20">
                    Seguinte <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- Lógica de Controlo e Motores de Animação em JavaScript -->
    <script>
        // Base de Dados das 10 Animações com Renderização e Lógica Individual
        const animations = [
            {
                id: 1,
                title: "O Conceito da Bolha Pessoal (Alcance)",
                number: "Cena 1",
                description: "A rede PAN (Personal Area Network) funciona como uma esfera ou 'bolha' invisível centrada na própria pessoa. O seu raio de ação é extremamente reduzido, limitando-se habitualmente a um raio de até 10 metros, ideal para o espaço de trabalho individual.",
                render: () => `
                    <div class="relative flex items-center justify-center w-full h-full fade-in-active">
                        <!-- Esfera da rede PAN -->
                        <div id="bubble-circle" class="absolute w-44 h-44 md:w-64 md:h-64 rounded-full border border-blue-500/40 bg-blue-500/5 flex items-center justify-center transition-all duration-1000 scale-0 opacity-0">
                            <span class="absolute top-3 text-[10px] md:text-xs font-bold text-blue-400 tracking-widest uppercase">Rede PAN (&le; 10 metros)</span>
                            <div class="absolute inset-0 rounded-full border border-dashed border-blue-400/20 pulse-circle"></div>
                        </div>
                        <!-- Utilizador Central -->
                        <div class="relative z-10 flex flex-col items-center">
                            <div class="bg-blue-600 p-4 rounded-full shadow-lg border border-blue-400/30 float-element">
                                <i data-lucide="user" class="w-10 h-10 text-white"></i>
                            </div>
                            <span class="text-xs mt-3 bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-slate-300 font-semibold shadow-md">Espaço Pessoal</span>
                        </div>
                    </div>
                `,
                init: () => {
                    setTimeout(() => {
                        const b = document.getElementById('bubble-circle');
                        if (b) {
                            b.classList.remove('scale-0', 'opacity-0');
                            b.classList.add('scale-100', 'opacity-100');
                        }
                    }, 150);
                }
            },
            {
                id: 2,
                title: "A Conexão dos Dispositivos Comuns",
                number: "Cena 2",
                description: "A rede PAN serve para interligar os aparelhos eletrónicos de uso quotidiano. O smartphone atua frequentemente como o nodo central que liga o computador portátil, fones, relógio inteligente e impressora.",
                render: () => `
                    <div class="relative flex items-center justify-center w-full h-full max-w-[400px] fade-in-active">
                        <!-- Smartphone Central -->
                        <div class="relative z-10 bg-slate-900 border-2 border-blue-500 p-3.5 rounded-2xl shadow-2xl flex items-center justify-center">
                            <i data-lucide="smartphone" class="w-8 h-8 text-blue-400"></i>
                        </div>

                        <!-- Dispositivos Circundantes (Satélites) -->
                        <div class="absolute" style="transform: translate(-110px, -90px);">
                            <div class="satellite bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-center shadow-lg transition-all duration-500 opacity-0 scale-50">
                                <i data-lucide="headphones" class="w-5 h-5 text-purple-400"></i>
                            </div>
                        </div>
                        <div class="absolute" style="transform: translate(110px, -90px);">
                            <div class="satellite bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-center shadow-lg transition-all duration-500 opacity-0 scale-50">
                                <i data-lucide="watch" class="w-5 h-5 text-green-400"></i>
                            </div>
                        </div>
                        <div class="absolute" style="transform: translate(-120px, 70px);">
                            <div class="satellite bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-center shadow-lg transition-all duration-500 opacity-0 scale-50">
                                <i data-lucide="laptop" class="w-5 h-5 text-amber-400"></i>
                            </div>
                        </div>
                        <div class="absolute" style="transform: translate(120px, 70px);">
                            <div class="satellite bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-center shadow-lg transition-all duration-500 opacity-0 scale-50">
                                <i data-lucide="printer" class="w-5 h-5 text-pink-400"></i>
                            </div>
                        </div>

                        <!-- Vetores de Ligação de Rede -->
                        <svg class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 0;">
                            <line id="net-line-1" x1="50%" y1="50%" x2="22%" y2="35%" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" class="transition-opacity duration-500 opacity-0"></line>
                            <line id="net-line-2" x1="50%" y1="50%" x2="78%" y2="35%" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" class="transition-opacity duration-500 opacity-0"></line>
                            <line id="net-line-3" x1="50%" y1="50%" x2="20%" y2="65%" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" class="transition-opacity duration-500 opacity-0"></line>
                            <line id="net-line-4" x1="50%" y1="50%" x2="80%" y2="65%" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" class="transition-opacity duration-500 opacity-0"></line>
                        </svg>
                    </div>
                `,
                init: () => {
                    setTimeout(() => {
                        const satellites = document.querySelectorAll('.satellite');
                        satellites.forEach((sat, i) => {
                            setTimeout(() => {
                                sat.classList.remove('opacity-0', 'scale-50');
                                sat.classList.add('opacity-100', 'scale-100');
                                const line = document.getElementById(`net-line-${i + 1}`);
                                if (line) line.classList.remove('opacity-0');
                            }, i * 200);
                        });
                    }, 150);
                }
            },
            {
                id: 3,
                title: "O Bluetooth em Ação (WPAN)",
                number: "Cena 3",
                description: "A variante sem fios é designada por WPAN (Wireless PAN). O padrão Bluetooth emite pacotes de dados por via aérea, permitindo o emparelhamento rápido e eliminando a necessidade de cabos na sua secretária.",
                render: () => `
                    <div class="relative flex items-center justify-center w-full h-full fade-in-active">
                        <!-- Ondas de Sinal Dinâmicas -->
                        <div class="absolute w-16 h-16 rounded-full border-2 border-blue-500 bg-blue-500/5 wave-effect"></div>
                        <div class="absolute w-16 h-16 rounded-full border-2 border-blue-500 bg-blue-500/5 wave-effect" style="animation-delay: 0.6s;"></div>
                        <div class="absolute w-16 h-16 rounded-full border-2 border-blue-500 bg-blue-500/5 wave-effect" style="animation-delay: 1.2s;"></div>

                        <!-- Logotipo Bluetooth Centralizado -->
                        <div class="relative z-10 bg-gradient-to-br from-blue-600 to-indigo-700 p-6 rounded-full shadow-2xl border border-blue-400/40 flex items-center justify-center float-element">
                            <svg class="w-12 h-12 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m7 7 10 10-5 5V2l5 5L7 17"></path>
                            </svg>
                        </div>
                    </div>
                `,
                init: () => {}
            },
            {
                id: 4,
                title: "A Rede PAN Cabeada (Cabo USB)",
                number: "Cena 4",
                description: "Uma rede PAN também pode ser estruturada por fios. Quando liga fisicamente o telemóvel ao seu computador através de um cabo USB para transferir ficheiros ou carregar a bateria, está a formar uma PAN com fios.",
                render: () => `
                    <div class="relative flex flex-col md:flex-row items-center justify-around w-full max-w-[500px] fade-in-active">
                        <!-- Portátil -->
                        <div class="flex flex-col items-center">
                            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-md">
                                <i data-lucide="laptop" class="w-12 h-12 text-amber-400"></i>
                            </div>
                            <span class="text-xs text-slate-400 mt-2 font-medium">Computador</span>
                        </div>

                        <!-- Cabo e Fluxo Físico de Dados -->
                        <div class="w-1.5 md:w-36 h-20 md:h-1.5 flex items-center justify-center my-4 md:my-0 relative">
                            <!-- O Cabo -->
                            <div id="physical-cable" class="absolute bg-slate-700 rounded transition-all duration-1000" style="width: 0%; height: 5px;"></div>
                            <!-- Pacote de Dados Viajando no Cabo -->
                            <div id="cable-packet" class="absolute w-3.5 h-3.5 bg-blue-500 rounded-full hidden shadow-lg shadow-blue-500/50" style="left: 0%;"></div>
                        </div>

                        <!-- Smartphone -->
                        <div class="flex flex-col items-center">
                            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-md">
                                <i data-lucide="smartphone" class="w-12 h-12 text-blue-400"></i>
                            </div>
                            <span class="text-xs text-slate-400 mt-2 font-medium">Telemóvel</span>
                        </div>
                    </div>
                `,
                init: () => {
                    setTimeout(() => {
                        const cable = document.getElementById('physical-cable');
                        const packet = document.getElementById('cable-packet');
                        if (cable) {
                            cable.style.width = '100%';
                            
                            setTimeout(() => {
                                if (packet) {
                                    packet.classList.remove('hidden');
                                    let progress = 0;
                                    let movingRight = true;
                                    const loop = setInterval(() => {
                                        if (movingRight) {
                                            progress += 2;
                                            if (progress >= 100) movingRight = false;
                                        } else {
                                            progress -= 2;
                                            if (progress <= 0) movingRight = true;
                                        }
                                        packet.style.left = `${progress}%`;
                                    }, 20);
                                    packet.dataset.intervalId = loop;
                                }
                            }, 1000);
                        }
                    }, 150);
                }
            },
            {
                id: 5,
                title: "Interrupção do Sinal (Limite)",
                number: "Cena 5",
                description: "As redes PAN têm limites de distância físicos rigorosos. À medida que afasta os auscultadores ou relógio do telemóvel emissor, o sinal fica instável até a conexão cair completamente por falta de alcance.",
                render: () => `
                    <div class="relative flex items-center justify-betweew-full max-w-[480px] fade-in-active">
                        <!-- Telemóvel Estático -->
                        <div class="flex flex-col items-center">
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-md">
                                <i data-lucide="smartphone" class="w-10 h-10 text-blue-400"></i>
                            </div>
                        </div>

                        <!-- Canal de Comunicação Degradando-se -->
                        <div class="flex-grow mx-4 relative flex items-center justify-center">
                            <div id="connection-line" class="w-full h-1 bg-blue-500 rounded transition-all duration-1000"></div>
                            <div id="lost-alert" class="absolute bg-red-500/20 text-red-400 border border-red-500/40 text-[10px] font-extrabold px-3 py-1 rounded-full opacity-0 transition-opacity duration-500 tracking-wider">
                                SINAL PERDIDO
                            </div>
                        </div>

                        <!-- Auricular Afastando-se -->
                        <div id="moving-receiver" class="flex flex-col items-center transition-transform duration-1000 transform translate-x-0">
                            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-md">
                                <i data-lucide="headphones" class="w-10 h-10 text-purple-400"></i>
                            </div>
                        </div>
                    </div>
                `,
                init: () => {
                    setTimeout(() => {
                        const rec = document.getElementById('moving-receiver');
                        const line = document.getElementById('connection-line');
                        const alert = document.getElementById('lost-alert');

                        if (rec && line && alert) {
                            // Fase 1: Afasta o dispositivo e enfraquece sinal (muda para amarelo)
                            setTimeout(() => {
                                line.classList.remove('bg-blue-500');
                                line.classList.add('bg-yellow-500');
                                rec.style.transform = 'translateX(60px)';
                            }, 800);

                            // Fase 2: Afasta mais e perde sinal (vermelho / quebra)
                            setTimeout(() => {
                                line.classList.remove('bg-yellow-500');
                                line.classList.add('bg-red-500');
                                line.style.opacity = '0.15';
                                alert.classList.remove('opacity-0');
                                rec.style.transform = 'translateX(140px)';
                            }, 2000);
                        }
                    }, 150);
                }
            },
            {
                id: 6,
                title: "A Rede Vestível (Wearables & Saúde)",
                number: "Cena 6",
                description: "Atualmente, vestimos a rede PAN. Sensores de fitness no sapato, vestuário inteligente e leitores biológicos geram dados constantes que são recolhidos e monitorizados diretamente pelo telemóvel.",
                render: () => `
                    <div class="relative flex items-center justify-center w-full h-full fade-in-active">
                        <!-- Sensor Cardíaco Vestível -->
                        <div class="relative z-10 flex flex-col items-center">
                            <div class="bg-emerald-500/10 border-2 border-emerald-500 p-7 rounded-full relative shadow-2xl">
                                <i data-lucide="activity" class="w-16 h-16 text-emerald-400 heart-beat-element"></i>
                                <!-- Sensores Biométricos a Piscar -->
                                <span class="absolute top-2 left-2 w-3.5 h-3.5 bg-emerald-500 rounded-full animate-ping"></span>
                                <span class="absolute bottom-2 right-2 w-3.5 h-3.5 bg-emerald-500 rounded-full animate-ping" style="animation-delay: 0.6s;"></span>
                            </div>
                            <span class="text-xs text-emerald-400 mt-4 font-bold tracking-widest bg-emerald-500/10 px-3 py-1 rounded-full uppercase">Métrica em Tempo Real</span>
                        </div>
                    </div>
                `,
                init: () => {}
            },
            {
                id: 7,
                title: "Mestre e Escravos (Piconet)",
                number: "Cena 7",
                description: "Em redes WPAN como o Bluetooth, os aparelhos organizam-se numa micro-rede chamada 'Piconet'. Um deles assume o papel de 'Mestre' (coordenando a comunicação) e os restantes operam como 'Escravos' que executam as tarefas.",
                render: () => `
                    <div class="relative flex flex-col items-center justify-center w-full h-full gap-8 fade-in-active">
                        <!-- MESTRE -->
                        <div class="flex flex-col items-center">
                            <div class="relative bg-slate-900 p-4 rounded-2xl border-2 border-yellow-500 shadow-xl flex items-center justify-center">
                                <i data-lucide="crown" class="absolute -top-6 text-yellow-500 w-7 h-7 animate-bounce"></i>
                                <i data-lucide="smartphone" class="w-8 h-8 text-blue-400"></i>
                            </div>
                            <span class="text-xs text-yellow-400 font-bold mt-2 tracking-wide">Mestre (Controlador)</span>
                        </div>

                        <!-- ESCRAVOS -->
                        <div class="flex gap-16">
                            <div class="flex flex-col items-center">
                                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 shadow flex items-center justify-center">
                                    <i data-lucide="headphones" class="w-6 h-6 text-slate-400"></i>
                                </div>
                                <span class="text-[10px] text-slate-500 mt-1 font-semibold">Escravo 1</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 shadow flex items-center justify-center">
                                    <i data-lucide="watch" class="w-6 h-6 text-slate-400"></i>
                                </div>
                                <span class="text-[10px] text-slate-500 mt-1 font-semibold">Escravo 2</span>
                            </div>
                        </div>
                    </div>
                `,
                init: () => {}
            },
            {
                id: 8,
                title: "Segurança: Perigo de Bluejacking",
                number: "Cena 8",
                description: "O 'Bluejacking' é uma técnica em que invasores utilizam ligações Bluetooth abertas em locais públicos para enviar mensagens não solicitadas ou ficheiros diretamente para o seu aparelho sem autorização.",
                render: () => `
                    <div class="relative flex items-center justify-between w-full max-w-[460px] fade-in-active">
                        <!-- Dispositivo da Vítima -->
                        <div class="flex flex-col items-center">
                            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 relative shadow-md">
                                <i data-lucide="smartphone" class="w-10 h-10 text-blue-400"></i>
                                <!-- Mensagem de Alerta ao Receber Spam -->
                                <div id="popup-warning" class="absolute -top-14 -right-10 bg-red-600 border border-red-500 text-white text-[9px] font-black p-2 rounded-xl opacity-0 transition-opacity duration-700 shadow-2xl max-w-[120px]">
                                    Mensagem Spam Recebida!
                                </div>
                            </div>
                            <span class="text-xs text-slate-400 mt-2">Vítima</span>
                        </div>

                        <!-- Pacote Spam a Viajar -->
                        <div class="flex-grow mx-4 relative flex items-center justify-center">
                            <div id="spam-message" class="absolute w-9 h-9 bg-red-500/20 text-red-500 border border-red-500/30 rounded-full flex items-center justify-center hidden" style="left: 100%;">
                                <i data-lucide="mail-warning" class="w-4 h-4"></i>
                            </div>
                        </div>

                        <!-- Atacante Remoto -->
                        <div class="flex flex-col items-center">

            }

            const bt = document.getElementById('skipping-bt');
            if (bt && bt.dataset.intervalId) {
                clearInterval(parseInt(bt.dataset.intervalId));

                menuContainer.appendChild(btn);

        function loadScene(index) {
            clearTimers();
            currentScene = index;
            const item = animations[currentScene];

            buildNavMenu();

            // Altera o painel informativo superior
            document.getElementById('topic-number').innerText = item.number;
            document.getElementById('topic-title').innerText = item.title;

            const stage = document.getElementById('animation-stage');
            stage.innerHTML = item.render();

            // Atualiza ícones Lucide aplicados dinamicamente
            lucide.createIcons();

            // Corre funções internas específicas de cada cena
            item.init();

            // Controlos de rodapé
            document.getElementById('btn-prev').disabled = currentScene === 0;
            const nextBtn = document.getElementById('btn-next');
            if (currentScene === animations.length - 1) {
                nextBtn.innerHTML = 'Recomeçar <i data-lucide="rotate-ccw" class="w-4 h-4"></i>';
            } else {
                nextBtn.innerHTML = 'Seguinte <i data-lucide="chevron-right" class="w-4 h-4"></i>';
            }
            lucide.createIcons();
        }

        // Navegação por Botões de Rodapé
        document.getElementById('btn-prev').onclick = () => {
            if (currentScene > 0) {
                loadScene(currentScene - 1);
            }

        document.getElementById('btn-next').onclick = () => {
            if (currentScene < animations.length - 1) {
                loadScene(currentScene + 1);
            } else {
                // Se estiver no último slide, reinicia a apresentação
                loadScene(0);
            }
        };

        document.getElementById('btn-replay').onclick = () => {
            loadScene(currentScene);
        };

        // Carregamento Inicial do Projeto
        window.onload = () => {
            loadScene(0);
        };
